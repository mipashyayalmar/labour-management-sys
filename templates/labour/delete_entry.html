{% extends 'labour/base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0"><i class="fas fa-trash"></i> Delete Entry</h4>
            </div>
            <div class="card-body text-center">
                <p>Are you sure you want to delete this entry?</p>
                <div class="alert alert-warning">
                    <strong>{{ entry.labour_name }}</strong><br>
                    Date: {{ entry.date|date:"d/m/Y" }}<br>
                    Amount: ₹{{ entry.total_amount|floatformat:2 }}
                </div>
                
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-trash"></i> Yes, Delete
                    </button>
                    <a href="{% url 'list_entries' %}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
